<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Potwierdzenie adresu e-mail | Project Weight Drop</title>
  <link rel="icon" href="brand-logo.png" type="image/png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #121416;
      color: #f7f7f5;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }
    main { width: min(100%, 720px); margin: 0 auto; }
    .status {
      padding: 28px 22px 30px;
      background: #1c2021;
      border-bottom: 3px solid #ff791b;
    }
    .brand { margin: 0 0 12px; color: #ff8b3c; font-size: 14px; font-weight: 700; }
    h1 { margin: 0 0 10px; font-size: 27px; line-height: 1.18; }
    .message { margin: 0 0 20px; color: #dde2e3; font-size: 16px; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 11px 20px;
      background: #ff791b;
      color: #161616;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }
    .button:hover { background: #ff984a; }
    .button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .hint { margin: 0; color: #c4cccd; font-size: 14px; }
    .poster { display: block; width: 100%; height: auto; }
    @media (min-width: 720px) {
      .status { padding: 32px 36px; }
      h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="status" role="status" aria-live="polite">
      <p class="brand">Project Weight Drop</p>
      <h1 id="status-title">Wróć do aplikacji</h1>
      <p class="message" id="status-message">Jeśli potwierdziłeś adres e-mail, możesz zalogować się w aplikacji.</p>
      <div class="actions">
        <a class="button" href="https://play.google.com/store/apps/details?id=com.projectweightdrop.app">Otwórz w Google Play</a>
        <p class="hint">Po otwarciu zaloguj się swoim adresem e-mail.</p>
      </div>
    </section>
    <img class="poster" src="email-confirmed-poster.jpg" alt="Project Weight Drop: plan posiłków, dziennik, lodówka, Coach i postępy" width="720" height="1280">
  </main>
  <script>
    (() => {
      const fragment = new URLSearchParams(location.hash.slice(1));
      const query = new URLSearchParams(location.search);
      const error = fragment.has('error') || fragment.has('error_code') || query.has('error') || query.has('error_code');
      const authenticated = !error && fragment.has('access_token');
      const confirmationType = fragment.get('type') || query.get('type');
      const title = document.getElementById('status-title');
      const message = document.getElementById('status-message');

      if (error) {
        title.textContent = 'Nie udało się potwierdzić adresu';
        message.textContent = 'Link mógł wygasnąć lub został już użyty. Sprawdź, czy możesz zalogować się w aplikacji.';
      } else if (authenticated && (confirmationType === 'signup' || confirmationType === 'email')) {
        title.textContent = 'Adres e-mail potwierdzony';
        message.textContent = 'Twoje konto jest gotowe. Wróć do aplikacji i zaloguj się.';
      } else if (authenticated) {
        title.textContent = 'Gotowe';
        message.textContent = 'Wróć do aplikacji, aby kontynuować.';
      }

      if (location.hash || location.search) {
        history.replaceState(null, '', location.pathname);
      }
    })();
  </script>
</body>
</html>
